<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRITON — Mission Health Intelligence</title>
<style>
:root {
  --bg: #060a13;
  --p: rgba(18,28,48,.6);
  --ln: rgba(130,170,230,.16);
  --tx: #e7eef9;
  --mu: #9db0cc;
  --g: #3ddc97;
  --y: #f5d547;
  --o: #ff9f43;
  --r: #ff4d5e;
  --cy: #4cc9f0;
  box-sizing: border-box;
}
html { height: 100%; }
*, *::before, *::after { box-sizing: inherit; margin: 0; }
body {
  min-height: 100%;
  background: radial-gradient(1200px 600px at 70% -10%, rgba(18,35,74,0.4), transparent), var(--bg);
  color: var(--tx);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
body::after { 
  content:''; position:fixed; inset:0; 
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.012) 3px, rgba(0,0,0,0.012) 6px); 
  pointer-events:none; z-index:100; 
}
h1 { font-size: 22px; font-weight: 600; letter-spacing: .02em; margin-bottom: 16px; }
h3 { font-size: 16px; font-weight: 600; }
h2 { font-size: 20px; margin: 6px 0 8px; }
.mu { color: var(--mu); }
p { margin: 4px 0; line-height: 1.6; }
.lbl { font: 600 12px ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--mu); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
.card { background: var(--p); border: 1px solid var(--ln); border-radius: 8px; padding: 18px; backdrop-filter: blur(10px); margin-bottom: 14px; }
.st { border-color: color-mix(in srgb, var(--c) 50%, transparent); box-shadow: 0 0 28px -10px var(--c); }
.clk { cursor: pointer; transition: transform .2s, box-shadow .2s; }
.clk:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
.inp { display:block; width:100%; margin-top:4px; background:rgba(0,0,0,.3); border:1px solid var(--ln); color:var(--tx); padding:8px 10px; border-radius:6px; font:inherit; }
label { display:block; font-size:12px; color:var(--mu); }
/* Emergency animations */
@keyframes pu { 0%,100%{box-shadow:0 0 20px -8px var(--r)} 50%{box-shadow:0 0 56px -2px var(--r),0 0 90px -20px rgba(255,77,94,0.4)} }
@keyframes critFlash { 0%,100%{border-color:rgba(255,77,94,0.4)} 50%{border-color:rgba(255,77,94,0.95)} }
@keyframes critBg { 0%,100%{background:rgba(255,77,94,0.05)} 50%{background:rgba(255,77,94,0.12)} }
@keyframes aSlide { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadein { from{opacity:0} to{opacity:1} }
@keyframes sp { to{transform:rotate(360deg)} }
.pulse { animation: pu 1.8s ease-in-out infinite; }
.crit-anim { animation: critFlash 1.8s ease-in-out infinite, critBg 1.8s ease-in-out infinite; }
.anim-fade { animation: fadein 0.3s ease; }
.anim-slide { animation: aSlide 0.35s ease both; }
.g2, .g3, .g4, .g6 { display: grid; gap: 14px; margin-bottom: 14px; }
.g2>.card, .g3>.card, .g4>.card, .g6>.card { margin: 0; }
.g2 { grid-template-columns: repeat(2,1fr); }
.g3 { grid-template-columns: repeat(3,1fr); }
.g4 { grid-template-columns: repeat(4,1fr); }
.g6 { grid-template-columns: repeat(6,1fr); }
@media(max-width:1000px) { .g3, .g4 { grid-template-columns: repeat(2,1fr); } .g6 { grid-template-columns: repeat(3,1fr); } .g2 { grid-template-columns: 1fr; } }
@media(max-width:560px) { .g3, .g4 { grid-template-columns: 1fr; } }
.shell { display: flex; min-height: 100vh; }
nav { width: 236px; flex: none; border-right: 1px solid var(--ln); padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; }
.brand { cursor: pointer; margin: 0 8px 16px; font-weight: bold; font-size: 18px; letter-spacing: 0.1em; color: var(--tx); }
.brand span { color: var(--cy); }
.sys { margin: 22px 8px 0; display: grid; gap: 6px; }
.ni { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 1px solid transparent; color: var(--mu); padding: 10px 12px; border-radius: 10px; cursor: pointer; font: inherit; margin-top: 4px; white-space: nowrap; }
.ni.on { color: var(--tx); background: rgba(76,201,240,.1); border-color: rgba(76,201,240,.3); }
.ni:hover:not(.on) { background: rgba(255,255,255,0.05); }
.alertdot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--r); box-shadow: 0 0 8px var(--r); }
main { flex: 1; padding: 18px 22px 100px; min-width: 0; }
@media(max-width:760px) { .shell { flex-direction: column; } nav { width: 100%; height: auto; position: static; display: flex; flex-wrap: wrap; gap: 6px; border: 0; border-bottom: 1px solid var(--ln); padding: 10px; } .brand { display: none; } .sys { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; width: 100%; } .navfoot { width: 100%; margin: 6px 0 0 !important; padding-top: 8px !important; border-top: 1px solid var(--ln) !important; } .ni { width: auto; margin: 0; } main { padding: 14px 14px 110px; } }
.top { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px; }
.top-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.top-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 12px ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); padding: 3px 9px; border-radius: 4px; }
.pill i, .ev i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }
.btn { background: rgba(76,201,240,.1); border: 1px solid rgba(76,201,240,.4); color: var(--tx); padding: 9px 14px; border-radius: 6px; font: 600 12px ui-monospace, monospace; letter-spacing: .06em; cursor: pointer; transition: 0.2s; }
.btn:hover { background: rgba(76,201,240,.24); }
.btn.r { background: rgba(255,77,94,.15); border-color: var(--r); color: var(--r); }
.btn.r:hover { background: rgba(255,77,94,.3); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;}
.big { font-size: 34px; font-weight: 700; letter-spacing: .06em; margin: 6px 0; }
.m { border-top: 2px solid var(--c); padding-top: 10px; min-height: 80px; display: flex; flex-direction: column; justify-content: space-between; } 
.m b { font-size: 24px; display: block; margin-top: 4px; letter-spacing: .02em; } 
.m small { color: var(--mu); font-weight: 400; font-size: 12px; }
.ch { width: 100%; display: block; margin-top: 8px; }
.tl { margin: 10px 0 0 6px; border-left: 1px solid var(--ln); } 
.ev { display: flex; gap: 12px; align-items: center; padding: 7px 0; flex-wrap: wrap; }
.ev[onclick] { cursor: pointer; } 
.ev i { margin-left: -4.5px; } 
.ev time { font: 12px ui-monospace, monospace; color: var(--mu); width: 62px; flex: none; }
.al { display: flex; gap: 10px; align-items: center; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); padding: 9px 12px; border-radius: 6px; margin-bottom: 8px; } 
.al b { font: 700 12px ui-monospace, monospace; letter-spacing: .12em; color: var(--c); }
.row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--ln); align-items: center; }
.row:last-child { border-bottom: none; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin: 4px 0 10px; } .bar i { display: block; height: 100%; background: var(--c, var(--o)); }
.rb { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; } .chip { padding: 5px 10px; border-radius: 4px; border: 1px solid var(--ln); font: 600 12px ui-monospace, monospace; color: var(--mu); transition: .3s; } .chip.on { color: var(--tx); border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; } .fact { border: 1px solid var(--ln); border-radius: 6px; padding: 10px; } .fact b { display: block; font-size: 15px; }
.sub { border: 1px solid var(--ln); border-radius: 6px; padding: 10px 12px; margin-top: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.flow { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 12px 0; text-align: center; } 
.flow .n { padding: 8px 14px; border-radius: 6px; border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); text-align: left; min-width: 140px; } 
.flow .ar { color: var(--mu); }
.demo { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 99; display: flex; flex-direction: column; gap: 12px; background: rgba(10,18,34,.94); border: 1px solid var(--cy); border-radius: 12px; padding: 12px 16px; backdrop-filter: blur(10px); }
.demo-content { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.hero { min-height: 100vh; display: grid; place-items: center; text-align: center; position: relative; overflow: hidden; padding: 24px;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(76,201,240,0.08), transparent),
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 85% 65%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 10% 75%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 30% 55%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 75% 80%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 90% 35%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 5% 50%, rgba(255,255,255,0.3), transparent),
    var(--bg);
}
.orb { position: absolute; inset: 0; margin: auto; width: min(92vw, 800px); height: min(92vw, 800px); opacity: .6; animation: sp 70s linear infinite; pointer-events: none; }
.hb { font-size: clamp(58px, 12vw, 112px); letter-spacing: .35em; font-weight: 300; margin: 8px 0 12px; padding-left: .35em; color: var(--tx); text-shadow: 0 0 80px rgba(76,201,240,0.3); }
.disclaimer { font-size: 12px; color: var(--mu); margin-top: 16px; font-style: italic; }
.insight-card { background: color-mix(in srgb, var(--p) 80%, transparent); }
.insight-card table { width: 100%; border-collapse: collapse; margin: 10px 0; font-family: ui-monospace, monospace; font-size: 13px; }
.insight-card th, .insight-card td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--ln); }
.insight-card th { color: var(--mu); font-weight: normal; }
.insight-ev { margin-top: 12px; background: rgba(0,0,0,0.25); border-radius: 8px; border: 1px solid var(--ln); overflow: hidden; }
.insight-ev-title { background: rgba(255,255,255,0.05); padding: 8px 12px; font-size: 12px; font-weight: bold; border-bottom: 1px solid var(--ln); display: flex; align-items: center; gap: 8px; letter-spacing:.08em; }
.insight-ev-content { padding: 12px; font-size: 13px; line-height: 1.8; }
.insight-ev-content div { margin: 2px 0; }
@media(prefers-reduced-motion: reduce) { .orb, .pulse, .crit-anim, .anim-fade, .anim-slide { animation: none; } .clk, .queue-item, .btn, .chip { transition: none; } .clk:hover, .queue-item:hover { transform: none; } }
.nav-map { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 20px; border: 1px solid var(--ln); margin: 14px 0; }
.queue-item { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; border: 1px solid var(--ln); border-left: 4px solid var(--c); border-radius: 10px; margin-bottom: 8px; background: rgba(0,0,0,0.15); cursor: pointer; transition: background 0.2s, transform 0.2s; }
.queue-item:hover { background: rgba(255,255,255,0.05); transform: translateX(2px); }
.sect-label { font: 600 12px ui-monospace,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--mu); margin: 22px 0 10px; display:flex; align-items:center; gap:8px; }
.sect-label::after { content:''; flex:1; height:1px; background:var(--ln); }
.stt { display:inline-block; margin-top:2px; font: 600 12px ui-monospace, Menlo, monospace; letter-spacing:.04em; color:var(--c); }
.demo-banner { display:flex; gap:10px; align-items:center; flex-wrap:wrap; border:1px dashed var(--o); background:rgba(255,159,67,.08); border-radius:6px; padding:8px 12px; margin-bottom:14px; font-size:13px; }
.demo-banner b { font: 700 12px ui-monospace, Menlo, monospace; letter-spacing:.12em; color:var(--o); }
button:focus-visible, [tabindex]:focus-visible, .inp:focus-visible { outline: 2px solid var(--cy); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// === CONSTANTS ===
const K = { crit: 'var(--r)', mon: 'var(--y)', ok: 'var(--g)', warn: 'var(--o)', info: 'var(--cy)', cy: 'var(--cy)' };
const ALERT_LABELS = {info:'INFO',mon:'MONITOR',warn:'WARNING',crit:'CRITICAL',ok:'NOMINAL'};

// Single source of truth for values shown on several pages
const EVA_LOC = 'Lab Module, Sector B';
const RESP_DIST = 14;      // metres, nearest responder to Maya
const MAYA_CRIT_HR = 121;  // BPM at the critical event

const CREW = [
  {id:'maya', n:'Maya Chen', r:'Mission Specialist', s:'crit', l:'Critical', hr:MAYA_CRIT_HR, get recovery() { return MISSION.health.recovery.current; }, movement:'Very Low', comm:'No Response', loc:EVA_LOC, suit:'Online', get extra() { return [['Heart Rate',`${MAYA_CRIT_HR} BPM`],['Recovery',`${MISSION.health.recovery.current}%`],['Movement','Very Low'],['Communication','No Response'],['Location',EVA_LOC]]; }},
  {id:'alex', n:'Alex Rahman', r:'Commander', s:'ok', l:'Stable', hr:78, recovery:81, movement:'Normal', comm:'Active', loc:'Lab Module', extra:[['Heart Rate','78 BPM'],['Recovery','81%'],['Movement','Normal']]},
  {id:'sarah', n:'Sarah Collins', r:'Flight Engineer', s:'mon', l:'Monitor', hr:84, recovery:68, movement:'Normal', comm:'Active', loc:'Hab Module', extra:[['Heart Rate','84 BPM'],['Symptom','Headache reported'],['Recovery','68%']]},
  {id:'daniel', n:'Daniel Kim', r:'Mission Specialist', s:'ok', l:'Available', hr:76, recovery:79, movement:'Normal', comm:'Active', loc:'Lab Module', extra:[['Heart Rate','76 BPM'],['Recovery','79%'],['Distance to Maya',`${RESP_DIST} m`]]}
];

// === CENTRAL MOCK MISSION STATE (spec §17): one source for Maya's values across pages ===
const MISSION = {
  mission: { day: 143, evaWindowMin: 240, crewCount: 4, location: EVA_LOC },
  health: {
    restingHR: { preflight: 71, recent: 73, current: 81 },
    recovery: { weekStart: 80, current: 64 },
    sleep: { preflightH: 7.4, last7: [7.1,6.8,6.5,6.2,6.0,5.9,5.7] },
    reaction: { preflightMs: 412, currentMs: 478 }
  },
  behavior: {
    sleepPct: -18, activityPct: -12, moodPct: -21, workloadPct: 17, stressPct: 24, socialPct: -13,
    sleepIrregularity: 'High', workloadTolerance: 'Reduced', isolation: 'Rising', workPattern: 'Changed', moodTrend: 'Declining'
  },
  mentalHealth: {
    latestState: 'Irritated', stressDays: 3, lowMoodCheckins: 3,
    motivation: 'Low', isolation: 'Moderate', sleepQuality: 'Poor',
    checkins: ['Good','Neutral','Neutral','Low','Stressed','Stressed','Irritated']
  },
  cognitive: { attention: { pre: 92, current: 81 }, memory: { pre: 88, current: 84 } },
  medical: { labsMeasuredDaysAgo: 12 }
};
const pctChange = (from, to) => Math.round((to - from) / from * 100);
const derived = {
  rhrDevRecent: pctChange(MISSION.health.restingHR.recent, MISSION.health.restingHR.current),
  reactionDev: pctChange(MISSION.health.reaction.preflightMs, MISSION.health.reaction.currentMs),
  recoveryDecline: Math.round((1 - MISSION.health.recovery.current / MISSION.health.recovery.weekStart) * 100),
  sleepAvgH: MISSION.health.sleep.last7.reduce((a, b) => a + b, 0) / 7,
  attentionDev: pctChange(MISSION.cognitive.attention.pre, MISSION.cognitive.attention.current),
  memoryDev: pctChange(MISSION.cognitive.memory.pre, MISSION.cognitive.memory.current)
};

derived.sleepDevPct = pctChange(MISSION.health.sleep.preflightH, derived.sleepAvgH);
// Keep the behavioral-review sleep figure on the same computation as every other page.
MISSION.behavior.sleepPct = derived.sleepDevPct;

// === ANALYSIS LAYER (spec §19): deterministic mock rules, no AI ===
function analyzeHealth(M = MISSION) {
  // Rule-based scoring (prototype thresholds, not clinically validated):
  //   recovery decline >= 15%                 -> 2 points, otherwise 1
  //   resting HR >= 10% above recent baseline -> +1
  //   workload >= 15% above baseline          -> +1
  //   total >= 3 -> "Emerging recovery risk detected" (warn), otherwise "Recovery trend deviation" (mon)
  // Real thresholds would need clinical review.
  const h = M.health, b = M.behavior;
  const score = (derived.recoveryDecline >= 15 ? 2 : 1) + (derived.rhrDevRecent >= 10 ? 1 : 0) + (b.workloadPct >= 15 ? 1 : 0);
  const risk = score >= 3;
  return {
    title: risk ? 'Emerging recovery risk detected' : 'Recovery trend deviation',
    severity: risk ? 'warn' : 'mon',
    confidence: risk ? 'Moderate' : 'Low',
    observations: [
      `sleep averaging ${fmtH(derived.sleepAvgH)}, below earlier baseline`,
      `resting HR ${h.restingHR.current} BPM, +${derived.rhrDevRecent}% vs recent baseline`,
      `recovery down ${derived.recoveryDecline}% over seven days`,
      `workload up ${b.workloadPct}%`
    ],
    contributors: ['Rising mission workload', 'EVA preparation', 'Less recovery time between tasks'],
    recommendation: 'Recovery period, then reassessment before EVA.',
    disclaimer: 'Rule-based trend summary for human review. Not a diagnosis.'
  };
}
const COMP_REPLY = {
  vent: 'Thank you for telling me. Feeling irritated for several days can wear anyone down. Would you like to talk through what has changed?',
  stress: 'Your recent check-ins show increased stress over three days. A short check-in can help us track whether this is easing.',
  reflect: 'What stood out about today? Separating workload from how you are feeling can make the picture clearer.',
  coping: 'Some options: a short rest block before EVA preparation, a brief stretch or breathing break, and raising workload concerns with your crew lead. A professional can suggest more.'
};
const CHECKIN_COL = {Good:'var(--g)',Neutral:'var(--mu)',Low:'var(--o)',Stressed:'var(--o)',Irritated:'var(--o)',Anxious:'var(--r)'};

const HEALTH_METRICS = [
  ['Heart Rate','94','BPM','mon', [68,72,75,70,80,85,90,94], 'LIVE • Wearable'],
  ['Resting HR', String(MISSION.health.restingHR.current),'BPM','warn', [72,73,73,75,77,79,80,81], 'COMPUTED • 4h ago'],
  ['Blood Oxygen','97','%','ok', [99,99,98,98,97,97,97,97], 'LIVE • Wearable'],
  ['Sleep', String(MISSION.health.sleep.last7[6]),'hrs','warn', [7.1,6.8,6.5,6.2,6.0,5.9,5.7], 'DERIVED • Wearable'],
  ['Recovery', String(MISSION.health.recovery.current),'%','warn', [80,79,78,82,74,69,64], 'TRITON-DERIVED'],
  ['Hydration','72','%','mon', [90,88,85,82,78,75,72], 'MEASURED • 2h ago'],
  ['Activity','68','min','ok', [60,65,70,75,80,72,68], 'LIVE • Wearable'],
  ['Stress','Mod','','mon', [30,35,40,45,55,60,65,65], 'SELF-REPORTED'],
  ['Temperature','36.8','°C','ok', [36.5,36.5,36.6,36.6,36.7,36.8,36.8], 'LIVE • Sensor']
];

const SCHEDULE = [
  ['09:00','Research Operations', ''],
  ['11:00','Equipment Maintenance', ''],
  ['13:00','Systems Check', ''],
  ['16:00','EVA Preparation', 'warn'],
  ['18:00','EVA', 'warn'],
  ['22:30','Recovery', ''],
  ['23:30','Sleep', '']
];

const TIMELINE = [
  ['08:00','Sleep deficit detected','mon'],
  ['10:30','Mission workload increased','mon'],
  ['12:15','Resting HR elevated above baseline','warn'],
  ['12:40','CO₂ increase detected (0.6% → 0.8%)','warn'],
  ['12:52','Multiple crew members report headaches','warn'],
  ['13:00','Possible environmental correlation flagged','info'],
  ['14:32','Critical physiological anomaly detected','crit'],
  ['14:33','Crew assistance alert triggered','crit'],
  ['14:34','Nearest responder identified — Daniel Kim','info']
];

const INSIGHTS = [
  {
    id: 0,
    title: 'Recovery Deterioration Detected',
    severity: 'warn',
    confidence: 'MODERATE',
    observed: [['Sleep',`↓ ${-derived.sleepDevPct}%`, 'var(--r)'],['Resting HR',`↑ ${derived.rhrDevRecent}%`, 'var(--o)'],['Mission workload',`↑ ${MISSION.behavior.workloadPct}%`, 'var(--o)'],['Recovery',`↓ ${derived.recoveryDecline}%`, 'var(--r)']],
    contributors: ['Sleep deficit — duration below 7-day baseline','Increased mission workload','Reduced recovery time between tasks'],
    get missionContext() { return `EVA scheduled in approximately ${Math.ceil(evaRemMin() / 60)} hours. High-demand activity approaching.`; },
    action: 'Consider a recovery period and reassessment before EVA preparation begins.',
    evidence: [`✓ Sleep below baseline (7-day avg ${fmtH(derived.sleepAvgH)} vs ${fmtH(MISSION.health.sleep.preflightH)} pre-flight)`,`✓ Resting HR above personal baseline (${MISSION.health.restingHR.current} vs ${MISSION.health.restingHR.recent} BPM)`,'✓ Mission workload increased over prior 48h','✓ Recovery score has declined for 3 consecutive days','— No single factor fully explains the trend']
  },
  {
    id: 1,
    title: 'Resting HR Elevation',

// === ACTIONS ===
let lastRenderKey = '';
const FOCUSABLE = 'button, input, select, textarea, [tabindex="0"]';
function render() {
  const app = document.getElementById('app');
  // Keep typed form values in state so a re-render never wipes them
  app.querySelectorAll('input[id], select[id], textarea[id]').forEach(el => { S.form[el.id] = el.value; });
  // Remember keyboard focus so it survives the innerHTML rebuild
  const key = S.v + ':' + S.s;
  const act = document.activeElement;
  const fIdx = app.contains(act) ? [...app.querySelectorAll(FOCUSABLE)].indexOf(act) : -1;
  let sel = null;
  try { if (act && act.selectionStart != null) sel = [act.selectionStart, act.selectionEnd]; } catch (e) {}

  app.innerHTML = S.v === 'hero' ? hero() : shell();

  app.querySelectorAll('input[id], select[id], textarea[id]').forEach(el => { if (el.id in S.form) el.value = S.form[el.id]; });
  // Make clickable non-button elements keyboard reachable
  app.querySelectorAll('[onclick]:not(button)').forEach(el => { el.setAttribute('role', 'button'); el.setAttribute('tabindex', '0'); });
  if (fIdx >= 0 && key === lastRenderKey) {
    const el = app.querySelectorAll(FOCUSABLE)[fIdx];
    if (el) {
      el.focus({ preventScroll: true });
      try { if (sel && el.setSelectionRange) el.setSelectionRange(sel[0], sel[1]); } catch (e) {}
    }
  }
  lastRenderKey = key;
  syncHash();
}

// Deep links: the current page is kept in the URL hash so refresh and bookmarks return to it
function syncHash() {
  const h = S.v === 'hero' ? '' : S.s;
  if (location.hash.slice(1) === h) return;
  try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) {}
}
function readHash() {
  const h = location.hash.slice(1);
  if (SC[h] && !(h === 'womens' && !cur().wh)) { S.v = 'app'; S.s = h; }
}

function resetDemo() {
  if (!confirm('Reset the demo to its starting state? Simulation progress, logged incidents and entered text will be cleared.')) return;
  Object.keys(S).forEach(k => delete S[k]);
  Object.assign(S, initialState());
  render();
}

function go(s) { S.s = s; render(); }
function enter() { S.v = 'app'; S.s = 'overview'; render(); }

function tog(i) {
  S.open[i] = !S.open[i];
  render();
}

function adv() {
  S.timeOffset += 10;
  render();
}

function ack() {
  S.ack = 1;
  render();
}

// === DEMO / SIMULATION LOGIC ===
function startSim() {
  if ((S.d >= 0 || S.em > 0) && !confirm('Restart the simulation from step 1? Current simulation progress will be reset.')) return;
  S.v = 'app';
  S.d = 0;
  S.open = {};
  S.corr = 0;
  S.evDetail = 0;
  S.steps = null;
  S.timeOffset = 0; // reset clock
  applyD();
}

function nextD() {
  if (S.d < DEMO_STEPS.length - 1) {
    S.d++;
    applyD();
  } else {
    stopD();
  }
}

function stopD() {
  S.d = -1;
  render();
}

function applyD() {
  const step = DEMO_STEPS[S.d];
  S.s = step.page;
  S.em = step.em;
  S.proto = step.proto;
  S.nav = step.nav;
  S.ack = S.d >= 12 ? 1 : 0;
  S.open[0] = S.d === 4;
  if (S.d === 7) S.corr = 1;
  else if (S.d < 7) S.corr = 0;
  S.steps = null;
  render();
}

// === ALERT CENTER / ACTIONS / REVIEW WORKFLOW / ROLES ===
function toggleAC() { S.ac = !S.ac; S.evSel = null; render(); }
function setACF(f) { S.acF = f; render(); }
function ackAlert(id) { S.acked[id] = true; if (id === 'E-0143') S.ack = 1; render(); }
function selEvent(id) { S.evSel = S.evSel === id ? null : id; render(); }
function openLink(page) { S.ac = false; S.evSel = null; go(page); }
function setAct(st) { S.act = st; render(); }
function advReview(kind) {
  const n = kind === 'med' ? MED_FLOW.length : BEH_FLOW.length;
  const note = document.getElementById('rv-note-' + kind);
  if (note && note.value.trim()) S.rvNote[kind] = note.value.trim();
  S.rv[kind] = Math.min(n - 1, (S.rv[kind] || 0) + 1);
  render();
}
function toggleFail(k) { S.fail[k] = !S.fail[k]; render(); }
function toggleGL() { S.gl = !S.gl; render(); }

// === INIT ===
document.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[role="button"][onclick]')) { e.preventDefault(); t.click(); }
});
document.addEventListener('input', e => {
  if (e.target && e.target.id) S.form[e.target.id] = e.target.value;
});
window.addEventListener('hashchange', () => { readHash(); render(); });
render();
</script>
</body>
</html>
