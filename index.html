<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRITON — Mission Health Intelligence</title>
<style>
:root {
  --bg: #060a13;
  --p: rgba(18,28,48,.6);
  --ln: rgba(130,170,230,.16);
  --tx: #e7eef9;
  --mu: #8496b3;
  --g: #3ddc97;
  --y: #f5d547;
  --o: #ff9f43;
  --r: #ff4d5e;
  --cy: #4cc9f0;
  box-sizing: border-box;
}
html { height: 100%; }
*, *::before, *::after { box-sizing: inherit; margin: 0; }
body {
  min-height: 100%;
  background: radial-gradient(1200px 600px at 70% -10%, rgba(18,35,74,0.4), transparent), var(--bg);
  color: var(--tx);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
body::after { 
  content:''; position:fixed; inset:0; 
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.012) 3px, rgba(0,0,0,0.012) 6px); 
  pointer-events:none; z-index:100; 
}
h1 { font-size: 22px; font-weight: 600; letter-spacing: .02em; margin-bottom: 16px; }
h3 { font-size: 16px; font-weight: 600; }
h2 { font-size: 20px; margin: 6px 0 8px; }
.mu { color: var(--mu); }
p { margin: 4px 0; line-height: 1.6; }
.lbl { font: 600 10.5px ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--mu); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
.card { background: var(--p); border: 1px solid var(--ln); border-radius: 8px; padding: 18px; backdrop-filter: blur(10px); margin-bottom: 14px; }
.st { border-color: color-mix(in srgb, var(--c) 50%, transparent); box-shadow: 0 0 28px -10px var(--c); }
.clk { cursor: pointer; transition: transform .2s, box-shadow .2s; }
.clk:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
/* Emergency animations */
@keyframes pu { 0%,100%{box-shadow:0 0 20px -8px var(--r)} 50%{box-shadow:0 0 56px -2px var(--r),0 0 90px -20px rgba(255,77,94,0.4)} }
@keyframes critFlash { 0%,100%{border-color:rgba(255,77,94,0.4)} 50%{border-color:rgba(255,77,94,0.95)} }
@keyframes critBg { 0%,100%{background:rgba(255,77,94,0.05)} 50%{background:rgba(255,77,94,0.12)} }
@keyframes aSlide { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadein { from{opacity:0} to{opacity:1} }
@keyframes sp { to{transform:rotate(360deg)} }
.pulse { animation: pu 1.8s ease-in-out infinite; }
.crit-anim { animation: critFlash 1.8s ease-in-out infinite, critBg 1.8s ease-in-out infinite; }
.anim-fade { animation: fadein 0.3s ease; }
.anim-slide { animation: aSlide 0.35s ease both; }
.g2, .g3, .g4, .g6 { display: grid; gap: 14px; margin-bottom: 14px; }
.g2>.card, .g3>.card, .g4>.card, .g6>.card { margin: 0; }
.g2 { grid-template-columns: repeat(2,1fr); }
.g3 { grid-template-columns: repeat(3,1fr); }
.g4 { grid-template-columns: repeat(4,1fr); }
.g6 { grid-template-columns: repeat(6,1fr); }
@media(max-width:1000px) { .g3, .g4 { grid-template-columns: repeat(2,1fr); } .g6 { grid-template-columns: repeat(3,1fr); } .g2 { grid-template-columns: 1fr; } }
@media(max-width:560px) { .g3, .g4 { grid-template-columns: 1fr; } }
.shell { display: flex; min-height: 100vh; }
nav { width: 236px; flex: none; border-right: 1px solid var(--ln); padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; }
.brand { cursor: pointer; margin: 0 8px 16px; font-weight: bold; font-size: 18px; letter-spacing: 0.1em; color: var(--tx); }
.brand span { color: var(--cy); }
.sys { margin: 22px 8px 0; display: grid; gap: 6px; }
.ni { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 1px solid transparent; color: var(--mu); padding: 10px 12px; border-radius: 10px; cursor: pointer; font: inherit; margin-top: 4px; white-space: nowrap; }
.ni.on { color: var(--tx); background: rgba(76,201,240,.1); border-color: rgba(76,201,240,.3); }
.ni:hover:not(.on) { background: rgba(255,255,255,0.05); }
.alertdot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--r); box-shadow: 0 0 8px var(--r); }
main { flex: 1; padding: 18px 22px 100px; min-width: 0; }
@media(max-width:760px) { .shell { flex-direction: column; } nav { width: 100%; height: auto; position: static; display: flex; overflow-x: auto; gap: 6px; border: 0; border-bottom: 1px solid var(--ln); padding: 10px; } .brand, .sys { display: none; } .ni { width: auto; margin: 0; } main { padding: 14px 14px 110px; } }
.top { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px; }
.top-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.top-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 11px ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); padding: 3px 9px; border-radius: 4px; }
.pill i, .ev i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }
.btn { background: rgba(76,201,240,.1); border: 1px solid rgba(76,201,240,.4); color: var(--tx); padding: 9px 14px; border-radius: 6px; font: 600 12px ui-monospace, monospace; letter-spacing: .06em; cursor: pointer; transition: 0.2s; }
.btn:hover { background: rgba(76,201,240,.24); }
.btn.r { background: rgba(255,77,94,.15); border-color: var(--r); color: var(--r); }
.btn.r:hover { background: rgba(255,77,94,.3); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;}
.big { font-size: 34px; font-weight: 700; letter-spacing: .06em; margin: 6px 0; }
.m { border-top: 2px solid var(--c); padding-top: 10px; min-height: 80px; display: flex; flex-direction: column; justify-content: space-between; } 
.m b { font-size: 24px; display: block; margin-top: 4px; letter-spacing: .02em; } 
.m small { color: var(--mu); font-weight: 400; font-size: 12px; }
.ch { width: 100%; display: block; margin-top: 8px; }
.tl { margin: 10px 0 0 6px; border-left: 1px solid var(--ln); } 
.ev { display: flex; gap: 12px; align-items: center; padding: 7px 0; flex-wrap: wrap; cursor: pointer; } 
.ev i { margin-left: -4.5px; } 
.ev time { font: 12px ui-monospace, monospace; color: var(--mu); width: 62px; flex: none; }
.al { display: flex; gap: 10px; align-items: center; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); padding: 9px 12px; border-radius: 6px; margin-bottom: 8px; } 
.al b { font: 700 10px ui-monospace, monospace; letter-spacing: .12em; color: var(--c); }
.row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--ln); align-items: center; }
.row:last-child { border-bottom: none; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin: 4px 0 10px; } .bar i { display: block; height: 100%; background: var(--c, var(--o)); }
.rb { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; } .chip { padding: 5px 10px; border-radius: 4px; border: 1px solid var(--ln); font: 600 10.5px ui-monospace, monospace; color: var(--mu); transition: .3s; } .chip.on { color: var(--tx); border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; } .fact { border: 1px solid var(--ln); border-radius: 6px; padding: 10px; } .fact b { display: block; font-size: 15px; }
.sub { border: 1px solid var(--ln); border-radius: 6px; padding: 10px 12px; margin-top: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.flow { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 12px 0; text-align: center; } 
.flow .n { padding: 8px 14px; border-radius: 6px; border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); text-align: left; min-width: 140px; } 
.flow .ar { color: var(--mu); }
.demo { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 99; display: flex; flex-direction: column; gap: 12px; background: rgba(10,18,34,.94); border: 1px solid var(--cy); border-radius: 12px; padding: 12px 16px; backdrop-filter: blur(10px); }
.demo-content { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.hero { min-height: 100vh; display: grid; place-items: center; text-align: center; position: relative; overflow: hidden; padding: 24px;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(76,201,240,0.08), transparent),
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 85% 65%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 10% 75%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 30% 55%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 75% 80%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 90% 35%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 5% 50%, rgba(255,255,255,0.3), transparent),
    var(--bg);
}
.orb { position: absolute; inset: 0; margin: auto; width: min(92vw, 800px); height: min(92vw, 800px); opacity: .6; animation: sp 70s linear infinite; pointer-events: none; }
.hb { font-size: clamp(58px, 12vw, 112px); letter-spacing: .35em; font-weight: 300; margin: 8px 0 12px; padding-left: .35em; color: var(--tx); text-shadow: 0 0 80px rgba(76,201,240,0.3); }
.disclaimer { font-size: 12px; color: var(--mu); margin-top: 16px; font-style: italic; }
.insight-card { background: color-mix(in srgb, var(--p) 80%, transparent); }
.insight-card table { width: 100%; border-collapse: collapse; margin: 10px 0; font-family: ui-monospace, monospace; font-size: 13px; }
.insight-card th, .insight-card td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--ln); }
.insight-card th { color: var(--mu); font-weight: normal; }
.insight-ev { margin-top: 12px; background: rgba(0,0,0,0.25); border-radius: 8px; border: 1px solid var(--ln); overflow: hidden; }
.insight-ev-title { background: rgba(255,255,255,0.05); padding: 8px 12px; font-size: 12px; font-weight: bold; border-bottom: 1px solid var(--ln); display: flex; align-items: center; gap: 8px; letter-spacing:.08em; }
.insight-ev-content { padding: 12px; font-size: 13px; line-height: 1.8; }
.insight-ev-content div { margin: 2px 0; }
@media(prefers-reduced-motion: reduce) { .orb, .pulse, .crit-anim { animation: none; } }
.nav-map { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 20px; border: 1px solid var(--ln); margin: 14px 0; }
.queue-item { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; border: 1px solid var(--ln); border-left: 4px solid var(--c); border-radius: 10px; margin-bottom: 8px; background: rgba(0,0,0,0.15); cursor: pointer; transition: background 0.2s, transform 0.2s; }
.queue-item:hover { background: rgba(255,255,255,0.05); transform: translateX(2px); }
.sect-label { font: 600 11px ui-monospace,monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--mu); margin: 22px 0 10px; display:flex; align-items:center; gap:8px; }
.sect-label::after { content:''; flex:1; height:1px; background:var(--ln); }
</style>
</head>
<body>
<div id="app"></div>

<script>
// === CONSTANTS ===
const K = { crit: 'var(--r)', mon: 'var(--y)', ok: 'var(--g)', warn: 'var(--o)', info: 'var(--cy)' };
const ALERT_LABELS = {info:'INFO',mon:'MONITOR',warn:'WARNING',crit:'CRITICAL',ok:'NOMINAL'};

const CREW = [
  {id:'maya', n:'Maya Chen', r:'Mission Specialist', s:'crit', l:'Critical', hr:121, recovery:64, movement:'Very Low', comm:'No Response', loc:'EVA Zone B', suit:'Online', extra:[['Heart Rate','121 BPM'],['Recovery','64%'],['Movement','Very Low'],['Communication','No Response'],['Location','EVA Zone B']]},
  {id:'alex', n:'Alex Rahman', r:'Commander', s:'ok', l:'Stable', hr:78, recovery:81, movement:'Normal', comm:'Active', loc:'Lab Module', extra:[['Heart Rate','78 BPM'],['Recovery','81%'],['Movement','Normal']]},
  {id:'sarah', n:'Sarah Collins', r:'Flight Engineer', s:'mon', l:'Monitor', hr:84, recovery:68, movement:'Normal', comm:'Active', loc:'Hab Module', extra:[['Heart Rate','84 BPM'],['Symptom','Headache reported'],['Recovery','68%']]},
  {id:'daniel', n:'Daniel Kim', r:'Mission Specialist', s:'ok', l:'Available', hr:76, recovery:79, movement:'Normal', comm:'Active', loc:'Lab Module', extra:[['Heart Rate','76 BPM'],['Recovery','79%'],['Distance to Maya','14 m']]}
];

const HEALTH_METRICS = [
  ['Heart Rate','94','BPM','mon', [68,72,75,70,80,85,90,94]],
  ['Resting HR','81','BPM','warn', [72,73,73,75,77,79,80,81]],
  ['Blood Oxygen','97','%','ok', [99,99,98,98,97,97,97,97]],
  ['Sleep','5.7','hrs','warn', [7.1,6.8,6.5,6.2,6.0,5.9,5.7]],
  ['Recovery','64','%','warn', [80,79,78,82,74,69,64]],
  ['Hydration','72','%','mon', [90,88,85,82,78,75,72]],
  ['Activity','68','min','ok', [60,65,70,75,80,72,68]],
  ['Stress','Mod','','mon', [30,35,40,45,55,60,65,65]],
  ['Temperature','36.8','°C','ok', [36.5,36.5,36.6,36.6,36.7,36.8,36.8]]
];

const SCHEDULE = [
  ['09:00','Research Operations', ''],
  ['11:00','Equipment Maintenance', ''],
  ['13:00','Systems Check', ''],
  ['16:00','EVA Preparation', 'warn'],
  ['18:00','EVA', 'warn'],
  ['22:30','Recovery', ''],
  ['23:30','Sleep', '']
];

const TIMELINE = [
  ['08:00','Sleep deficit detected','mon'],
  ['10:30','Mission workload increased','mon'],
  ['12:15','Resting HR elevated above baseline','warn'],
  ['12:40','CO₂ increase detected (0.6% → 0.8%)','warn'],
  ['12:52','Multiple crew members report headaches','warn'],
  ['13:00','Possible environmental correlation flagged','info'],
  ['14:32','Critical physiological anomaly detected','crit'],
  ['14:33','Crew assistance alert triggered','crit'],
  ['14:34','Nearest responder identified — Daniel Kim','info']
];

const EMSEQ = [
  ['14:32:10','Heart rate abnormality detected','warn'],
  ['14:32:20','Movement significantly reduced','warn'],
  ['14:32:40','No expected movement detected','crit'],
  ['14:32:50','No response to interaction prompt','crit'],
  ['14:32:55','🚨 CREW ALERT TRIGGERED','crit'],
  ['14:33:00','Daniel Kim identified — nearest available responder','info']
];

const INSIGHTS = [
  {
    id: 0,
    title: 'Recovery Deterioration Detected',
    severity: 'warn',
    confidence: 'MODERATE',
    observed: [['Sleep','↓ 26%', 'var(--r)'],['Resting HR','↑ 11%', 'var(--o)'],['Mission workload','↑ 18%', 'var(--o)'],['Recovery','↓ 18%', 'var(--r)']],
    contributors: ['Sleep deficit — duration below 7-day baseline','Increased mission workload','Reduced recovery time between tasks'],
    missionContext: 'EVA scheduled in approximately 4 hours. High-demand activity approaching.',
    action: 'Consider a recovery period and reassessment before EVA preparation begins.',
    evidence: ['✓ Sleep below 7-day baseline (5h 42m vs 7h 10m avg)','✓ Resting HR above personal baseline (81 vs 73 BPM)','✓ Mission workload increased over prior 48h','✓ Recovery score has declined for 3 consecutive days','— No single factor fully explains the trend']
  },
  {
    id: 1,
    title: 'Resting HR Elevation',
    severity: 'warn',
    confidence: 'MODERATE',
    observed: [['Resting HR','81 BPM', 'var(--o)'],['Baseline','~73 BPM', 'var(--cy)'],['Deviation','↑ 11%', 'var(--o)']],
    contributors: ['Sleep deficit','Accumulated workload'],
    missionContext: 'EVA approaching. Elevated resting HR combined with low recovery is a potential concern.',
    action: 'Reassessment suggested after the next sleep period.',
    evidence: ['✓ Resting HR 81 BPM vs personal baseline ~73 BPM','✓ Tracks sleep deficit timeline closely','✓ No acute illness indicator present','— This is an observed deviation, not a medical diagnosis']
  },
  {
    id: 2,
    title: 'Possible Environmental Correlation',
    severity: 'mon',
    confidence: 'POSSIBLE CORRELATION',
    observed: [['CO₂','0.6% → 0.8%', 'var(--o)'],['Crew symptoms','3 of 4', 'var(--o)'],['Time window','12:40–12:56', 'var(--cy)']],
    contributors: ['Timing overlap between CO₂ rise and symptom onset','Multiple crew members affected'],
    missionContext: 'All three affected crew members were in shared cabin zones during the event.',
    action: 'Requires human review: verify air-quality sensors and check ventilation system.',
    evidence: ['✓ CO₂ rose from 0.6% to 0.8% at 12:40','✓ Sarah Collins reported headache at 12:52','✓ Daniel Kim reported headache at 12:54','✓ Maya Chen reported headache at 12:56','— Timing overlap only. Causation is not established.','— CO₂ remains within technical limits but is elevated']
  }
];

const DEMO_STEPS = [
  {page:'overview', em:0, proto:0, nav:0, title:'Step 1 — Normal Operations', desc:'All crew nominal. Maya\'s recovery is trending slightly below her baseline.'},
  {page:'health',  em:0, proto:0, nav:0, title:'Step 2 — Health Degradation', desc:'Recovery has stayed below Maya\'s personal baseline for 3 days — sleep deficit and elevated workload.'},
  {page:'insights',em:0, proto:0, nav:0, title:'Step 3 — AI Analysis', desc:'TRITON detects: Sleep ↓, Resting HR ↑, Workload ↑, Recovery ↓. AI insight appears.'},
  {page:'mission', em:0, proto:0, nav:0, title:'Step 4 — Mission Context', desc:'EVA approaching. TRITON highlights the relevance of Maya\'s current state.'},
  {page:'environment',em:0,proto:0,nav:0, title:'Step 5 — Environment Event', desc:'CO₂ rises from 0.6% to 0.8%. Environmental anomaly logged.'},
  {page:'crew',    em:0, proto:0, nav:0, title:'Step 6 — Crew Correlation', desc:'Sarah, Daniel and Maya report headaches. TRITON flags a possible shared environmental correlation.'},
  {page:'emergency',em:3,proto:0,nav:0, title:'Step 7 — Emergency', desc:'14:32 — Maya\'s heart rate rises to 121 BPM. Movement drops sharply. Status: CRITICAL.'},
  {page:'emergency',em:5,proto:0,nav:0, title:'Step 8 — Crew Alert', desc:'No response detected. TRITON triggers crew assistance alert. Human assistance may be required.'},
  {page:'emergency',em:6,proto:0,nav:0, title:'Step 9 — Responder Identified', desc:'Daniel Kim identified as the nearest available crew member. Distance: 14 m.'},
  {page:'emergency',em:6,proto:1,nav:1, title:'Step 10 — Response', desc:'Daniel acknowledges alert and navigates to Maya. Response protocol active.'}
];

const HR_24H = [68,66,64,62,61,60,62,66,72,78,80,76,74,79,84,88,82,86,90,92,88,94,96,94];
const SLEEP_7D = [7.1,6.8,6.5,6.2,6.0,5.9,5.7];
const RECOVERY_7D = [80,79,78,82,74,69,64];
const ACTIVITY_7D = [92,88,101,75,80,72,68];
const CO2_DATA = [0.60,0.60,0.61,0.60,0.60,0.60,0.62,0.68,0.74,0.80,0.80,0.80];
const TEMP_DATA = [22.1,22.1,22.2,22.2,22.3,22.3,22.3,22.4,22.4,22.4,22.4,22.4];

// === STATE ===
const S = {
  v: 'hero',
  s: 'overview',
  t: 0,
  em: 0,
  ack: 0,
  proto: 0,
  nav: 0,
  d: -1,
  open: {},
  corr: 0,
  evDetail: 0,
  timeOffset: 0
};

// === HELPERS ===
const pad = n => String(n).padStart(2, '0');
const pill = (s, t) => `<span class="pill" style="--c:${K[s]}"><i></i>${t}</span>`;
const alrt = (s, t) => `<div class="al" style="--c:${K[s]}"><i></i><b class="mono">${ALERT_LABELS[s] || 'ALERT'}</b><span style="font-size:13px">${t}</span></div>`;

const getClock = () => {
    const d = new Date();
    d.setHours(14); // Base time for demo
    d.setMinutes(0);
    d.setMinutes(d.getMinutes() + S.timeOffset);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
};

const ch = (d, c, bar, h=80) => {
  const W=300,H=h,mx=Math.max(...d)*1.05,mn=bar?0:Math.min(...d)*0.95,n=d.length,y=v=>H-(v-mn)/(mx-mn)*(H-8)-3;
  if(bar) return `<svg viewBox="0 0 ${W} ${H}" class="ch" style="height:${h}px" preserveAspectRatio="none">${d.map((v,i)=>`<rect x="${i*W/n+4}" y="${y(v)}" width="${W/n-8}" height="${H-y(v)}" rx="2" fill="${c}" opacity=".75"/>`).join('')}</svg>`;
  const p=d.map((v,i)=>`${i?'L':'M'}${(i*W/(n-1)).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="ch" style="height:${h}px" preserveAspectRatio="none"><path d="${p}L${W} ${H}L0 ${H}Z" fill="${c}" opacity=".12"/><path d="${p}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
};

const mt = ([l, v, u, s, data]) => `
  <div class="m" style="--c:${K[s]}">
    <div>
      <div class="lbl">${l}</div>
      <b class="mono" style="color:${K[s]}">${v} <small>${u}</small></b>
    </div>
    ${data ? ch(data, K[s], false, 28) : ''}
  </div>
`;

const tl = arr => `
  <div class="tl">

        <p class="mu" style="margin-bottom:20px">Use the simulation to walk through the full emergency response scenario.</p>
        <button class="btn r" style="padding:12px 24px; font-size:13px" onclick="startSim()">▶ RUN MISSION SIMULATION</button>
      </div>
    `}
    
    ${S.em >= 1 ? `
    <div class="g2">
      <div class="card">
        <h2>Alert Sequence</h2>
        ${tl(EMSEQ.slice(0, S.em))}
      </div>
      
      ${S.em >= 5 ? `
      <div class="card">
        <h2>Crew Response</h2>
        <div class="sub">
          <div><b>Alex Rahman</b></div> <div class="mu">Monitoring</div>
        </div>
        <div class="sub">
          <div><b>Sarah Collins</b></div> <div class="mu">Monitoring</div>
        </div>
        <div class="sub st" style="--c:${K.info}; background: rgba(76,201,240,0.1)">
          <div><b>Daniel Kim</b><br><small class="lbl" style="color:var(--cy)">NEAREST RESPONDER (14m)</small></div> 
          <div>${S.proto ? `<span style="color:var(--g)">RESPONDING</span>` : `<span style="color:var(--cy)">AVAILABLE</span>`}</div>
        </div>
        ${S.proto ? `
          <div class="al anim-fade" style="--c:${K.ok}; margin-top:10px">
            <i></i><b>PROTOCOL ACTIVE</b>
          </div>
        ` : ''}
      </div>
      ` : '<div></div>'}
    </div>
    ` : ''}
  `,
  
  environment: () => `
    <h1>Environment Intelligence</h1>
    
    <div class="card" style="--c:${K.warn}">
      ${alrt('warn', 'ELEVATED CO₂ DETECTED (0.8%)')}
      <p class="mu">Requires human review: verify air-quality sensors and check ventilation system in shared zones.</p>
    </div>
    
    <div class="g6">
      <div class="card st" style="--c:${K.warn}">${mt(['CO₂','0.8','%','warn'])}</div>
      <div class="card">${mt(['Temp','22.4','°C','ok'])}</div>
      <div class="card">${mt(['Humidity','45','%','ok'])}</div>
      <div class="card">${mt(['Pressure','101.3','kPa','ok'])}</div>
      <div class="card">${mt(['Radiation','0.2','mSv','ok'])}</div>
      <div class="card">${mt(['Noise','62','dB','ok'])}</div>
    </div>
    
    <div class="g2">
      ${cc('CO₂ Trends (Last 12h)', CO2_DATA, 'var(--o)')}
      ${cc('Temperature Trends (°C)', TEMP_DATA, 'var(--g)')}
    </div>
    
    <div class="card ${S.d === 4 ? 'st pulse' : ''}" style="--c:${K.mon}">
      <div class="row" style="border:0">
        <h2>Shared Event Detection</h2>
        ${pill('mon', 'POSSIBLE CORRELATION')}
      </div>
      <p class="mu">Multiple crew members reported similar symptoms during the same environmental event.</p>
      <button class="btn" style="margin-top: 12px" onclick="S.corr=!S.corr;render()">${S.corr ? 'HIDE CORRELATION' : 'VIEW CORRELATION EVIDENCE'}</button>
      
      ${S.corr ? `
        <div class="insight-ev anim-fade" style="margin-top:10px">
          <div class="insight-ev-title"><i style="color:var(--cy)">✦</i> Analysis Evidence</div>
          <div class="insight-ev-content">
            ${INSIGHTS[2].evidence.map(e => `<div>${e}</div>`).join('')}
          </div>
        </div>
      ` : ''}
    </div>
    
    <div class="card">
      <h2>Environmental Events</h2>
      ${tl([
        ['10:00', 'Nominal environmental sweep completed', 'ok'],
        ['12:40', 'CO₂ rise detected (0.6% → 0.8%)', 'warn'],
        ['13:00', 'Correlation flagged with crew symptoms', 'info']
      ])}
    </div>
    <p class="disclaimer">Wellness indicators for situational awareness — not medically diagnostic.</p>
  `
};

// === APP SHELL ===
const hero = () => `
  <div class="hero anim-fade">
    <div class="orb">
      <svg viewBox="0 0 400 400" width="100%" height="100%">
        <circle cx="200" cy="200" r="62" fill="rgba(76,201,240,0.07)" stroke="var(--cy)" stroke-opacity=".35" stroke-width="1"/>
        <ellipse cx="200" cy="200" rx="174" ry="72" fill="none" stroke="rgba(130,170,230,.3)" stroke-width="1" transform="rotate(-22 200 200)"/>
        <ellipse cx="200" cy="200" rx="148" ry="55" fill="none" stroke="rgba(76,201,240,.12)" stroke-width="1" transform="rotate(12 200 200)"/>
        <circle cx="200" cy="200" r="122" fill="none" stroke="rgba(130,170,230,.18)" stroke-width="1" stroke-dasharray="2 7"/>
        <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(76,201,240,.08)" stroke-width="1" stroke-dasharray="1 10"/>
        <g transform="rotate(-22 200 200)"><circle cx="374" cy="200" r="5" fill="var(--cy)" opacity=".9"/></g>
        <g transform="rotate(12 200 200)"><circle cx="348" cy="200" r="3.5" fill="rgba(130,170,230,.7)"/></g>
        <circle cx="200" cy="78" r="2.5" fill="rgba(255,255,255,0.4)"/>
        <circle cx="322" cy="138" r="1.5" fill="rgba(255,255,255,0.3)"/>
      </svg>
    </div>
    <div style="position:relative; z-index:10; max-width:640px">
      <div class="pill" style="--c:${K.info}; margin-bottom:24px"><i></i>MISSION HEALTH INTELLIGENCE</div>
      <div class="hb">TRITON</div>
      <p style="font-size:18px; font-weight:300; letter-spacing:0.04em; margin:0 0 16px; color:var(--tx); opacity:0.9">From health monitoring to mission-aware action.</p>
      <p class="mu" style="font-size:15px; margin-bottom:44px; line-height:1.7; max-width:520px; margin-left:auto; margin-right:auto">
        TRITON combines astronaut health, crew status, spacecraft environment, and mission context to help crews understand emerging situations and coordinate a response when assistance is needed.
      </p>
      <div class="btns" style="justify-content:center; gap:16px; margin-top:0">
        <button class="btn" style="padding:12px 28px; font-size:13px; letter-spacing:.1em" onclick="enter()">ENTER MISSION CONTROL</button>
        <button class="btn r" style="padding:12px 28px; font-size:13px; letter-spacing:.1em; background:rgba(255,159,67,.15); border-color:var(--o); color:var(--o)" onclick="startSim()">▶ RUN MISSION SIMULATION</button>
      </div>
      <div style="margin-top:20px; display:flex; gap:24px; justify-content:center; flex-wrap:wrap">
        ${[['Health Monitoring','♡'],['AI Analysis','✦'],['Crew Awareness','⚉'],['Emergency Response','⚠']].map(([l,i])=>`<span style="font:600 11px ui-monospace,monospace;letter-spacing:.1em;color:var(--mu);display:flex;gap:6px;align-items:center"><span style="color:var(--cy)">${i}</span>${l}</span>`).join('')}
      </div>
      <p class="disclaimer" style="margin-top:48px">Decision-support prototype · Mock data only · Not a diagnostic tool</p>
    </div>
  </div>
`;

const demoBar = () => {
  if (S.d < 0) return '';
  const step = DEMO_STEPS[S.d];
  return `
    <div class="demo anim-fade">
      <div style="height:2px; background:var(--ln); border-radius:1px; width:100%">
        <div style="height:100%; width:${(S.d+1)*10}%; background:var(--cy); border-radius:1px; transition:width .3s"></div>
      </div>
      <div class="demo-content">
        <div>
          <div class="lbl" style="color:var(--cy); margin-bottom:4px">TRITON MISSION SIMULATION — Step ${S.d + 1}/10</div>
          <b>${step.title}</b>
          <p class="mu" style="font-size:13px; max-width:600px">${step.desc}</p>
        </div>
        <div class="btns">
          ${S.d < 9 ? `<button class="btn" style="background:var(--cy); color:#000" onclick="nextD()">NEXT ▶</button>` : `<button class="btn" style="background:var(--g); color:#000" onclick="stopD()">FINISH</button>`}
          <button class="btn r" onclick="stopD()">EXIT</button>
        </div>
      </div>
    </div>
  `;
};

const shell = () => `
  <div class="shell anim-fade">
    <nav>
      <div class="brand" onclick="S.v='hero'; render()" style="padding:4px 0 20px; border-bottom:1px solid var(--ln); margin-bottom:8px">
        <div style="font-size:20px; letter-spacing:.28em; font-weight:300; color:var(--tx)">TRITON</div>
        <div class="lbl" style="margin-top:3px; letter-spacing:.12em">Mission Health Intelligence</div>
      </div>
      <div class="sys">
        ${[['overview','Mission Overview','◈'], ['health','My Health','♡'], ['insights','AI Insights','✦'], ['mission','Mission','◷'], ['crew','Crew','⚉'], ['emergency','Emergency','⚠'], ['environment','Environment','☁']].map(([id, n, i]) => `
          <button class="ni ${S.s === id ? 'on' : ''}" onclick="go('${id}')">
            <span style="width:16px;text-align:center;opacity:0.7">${i}</span> ${n}
            ${id==='emergency' && S.em>=3 ? '<div class="alertdot"></div>' : ''}
          </button>
        `).join('')}
      </div>
      <div style="margin-top:auto; padding-top:24px; border-top:1px solid var(--ln); margin-top:24px">
        <div class="pill" style="--c:var(--g); margin-bottom:8px"><i></i>TRITON SYSTEMS ONLINE</div>
        <div class="lbl">Mission Day 143</div>
        <div class="mu" style="font-size:12px; margin-top:2px">ISS / Deep Space Sim</div>
      </div>
    </nav>
    <main>
      <div class="top">
        <div class="top-left">
          <span class="lbl" style="color:var(--cy)">◷</span>
          <span class="lbl">${getClock()} MET</span>
          <span class="pill" style="--c:var(--mu); font-size:10px">DAY 143</span>
        </div>
        <div class="top-right">
          ${S.em < 3 ? `<span class="pill" style="--c:var(--g)"><i></i>4 NOMINAL</span>` : `<span class="pill" style="--c:var(--r)"><i></i>3 NOM / 1 CRITICAL</span>`}
          <span class="pill" style="--c:var(--g)"><i></i>COMMS NOM</span>
          ${S.d < 0 ? `<button class="btn" style="padding:6px 12px; font-size:11px" onclick="adv()">+ 10 MIN</button>
          <button class="btn r" style="padding:6px 14px; font-size:11px; background:rgba(255,159,67,.12); border-color:var(--o); color:var(--o)" onclick="startSim()">▶ RUN SIMULATION</button>` : ''}
        </div>
      </div>
      ${SC[S.s]()}
    </main>
    ${demoBar()}
  </div>
`;

// === ACTIONS ===
function render() {
  document.getElementById('app').innerHTML = S.v === 'hero' ? hero() : shell();
}

function go(s) { S.s = s; render(); }
function enter() { S.v = 'app'; S.s = 'overview'; render(); }

function tog(i) {
  S.open[i] = !S.open[i];
  render();
}

function adv() {
  S.timeOffset += 10;
  render();
}

function ack() {
  S.ack = 1;
  render();
}

// === DEMO / SIMULATION LOGIC ===
function startSim() {
  S.v = 'app';
  S.d = 0;
  S.open = {};
  S.corr = 0;
  S.evDetail = 0;
  S.timeOffset = 0; // reset clock
  applyD();
}

function nextD() {
  if (S.d < 9) {
    S.d++;
    applyD();
  } else {
    stopD();
  }
}

function stopD() {
  S.d = -1;
  render();
}

function applyD() {
  const step = DEMO_STEPS[S.d];
  S.s = step.page;
  S.em = step.em;
  S.proto = step.proto;
  S.nav = step.nav;
  
  // specific state overrides based on step
  if (S.d === 1) {
    // health page: TRITON STATUS opened implicitly via default render
  }
  if (S.d === 2) {
    S.open[0] = true;
  } else {
    S.open[0] = false;
  }
  
  if (S.d === 5) {
    S.corr = 1;
  } else if (S.d < 5) {
    S.corr = 0;
  }
  
  if (S.d === 9) {
    S.proto = 1;
    S.nav = 1;
    S.ack = 1;
  }
  
  render();
}

// === INIT ===
render();
</script>
</body>
</html>
